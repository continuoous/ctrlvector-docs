site_name: CtrlVector Documentation
site_description: Product documentation, configuration guidance, training, and certification preparation for CtrlVector
site_url: https://continuoous.github.io/ctrlvector-docs/
repo_url: https://github.com/continuoous/ctrlvector-docs
repo_name: continuoous/ctrlvector-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Product overview: getting-started/product-overview.md
      - Learning paths: training/learning-paths.md
  - Concepts:
      - Exact variance decomposition: concepts/variance-decomposition.md
  - Configuration:
      - Dimensions: configuration/dimensions.md
  - Reference:
      - Transaction codes: reference/transaction-codes.md
      - Glossary: reference/glossary.md
  - Contribute:
      - Authoring standard: contributing/authoring-standard.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright &copy; CtrlVector
