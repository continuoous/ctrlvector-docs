site_name: CtrlVector Documentation
site_description: Product documentation, configuration guidance, training, and certification preparation for CtrlVector
site_url: https://continuoous.github.io/ctrlvector-docs/
repo_url: https://github.com/continuoous/ctrlvector-docs
repo_name: continuoous/ctrlvector-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Welcome to CtrlVector:
      - Welcome: getting-started/index.md
      - Product overview: getting-started/product-overview.md
      - Using this handbook: getting-started/using-this-handbook.md
      - Choose a learning path: training/learning-paths.md
  - Foundations:
      - Foundations: concepts/index.md
      - Exact variance decomposition: concepts/variance-decomposition.md
      - CtrlVector terminology: concepts/terminology.md
      - Core business objects: concepts/core-business-objects.md
  - Implementation guide:
      - Implementation guide: implementation/index.md
      - Plan the implementation: implementation/plan.md
      - Build the foundation: implementation/foundation.md
      - Configure the semantic model: implementation/semantic-model.md
      - Load and govern data: implementation/data-workflow.md
      - Create and validate the Bridge: implementation/bridge-validation.md
  - Operating CtrlVector:
      - Operating CtrlVector: operating/index.md
      - End-to-end workflow: operating/end-to-end-workflow.md
      - Prepare and submit data: operating/prepare-and-submit-data.md
      - Finalize databases: operating/finalize-databases.md
      - Create bridges: operating/create-bridges.md
      - Review results: operating/review-results.md
  - Configuration:
      - Configuration: configuration/index.md
      - Dimensions: configuration/dimensions.md
      - Dimension policy templates: configuration/dimension-policy-templates.md
      - Factors: configuration/factors.md
      - Nodes and calculation structures: configuration/nodes.md
      - Versions, calendars, and periods: configuration/time-and-versions.md
      - Analyses and templates: configuration/analyses-and-templates.md
      - Ownership and decision structures: configuration/ownership-and-decisions.md
  - Analysis and interpretation:
      - Analysis and interpretation: analysis/index.md
      - Read a bridge: analysis/read-a-bridge.md
      - Dimension drilldowns: analysis/dimension-drilldowns.md
      - Mix and interaction effects: analysis/mix-and-interaction-effects.md
      - Decision lenses and control vectors: analysis/decision-lenses-and-control-vectors.md
      - Communicate conclusions: analysis/communicate-conclusions.md
  - Administration and governance:
      - Administration and governance: administration/index.md
      - Environment setup: administration/environment-setup.md
      - Access and roles: administration/access-and-roles.md
      - Data governance: administration/data-governance.md
      - Lifecycle management: administration/lifecycle-management.md
      - Auditability and controls: administration/auditability-and-controls.md
  - Practice and training:
      - Practice and training: training/index.md
      - Worked examples: training/worked-examples.md
      - Guided exercises: training/guided-exercises.md
      - Learning paths: training/learning-paths.md
      - Knowledge checks: training/knowledge-checks.md
      - Certification preparation: training/certification-preparation.md
  - Reference:
      - Reference: reference/index.md
      - Transaction codes: reference/transaction-codes.md
      - File and field reference: reference/file-and-field-reference.md
      - Glossary: reference/glossary.md
      - Troubleshooting: reference/troubleshooting.md
      - Formulas and conventions: reference/formulas-and-conventions.md
  - Contribute:
      - Authoring standard: contributing/authoring-standard.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright &copy; CtrlVector
